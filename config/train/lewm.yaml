defaults:
  - _self_
  - data: libero

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True

vision_encoder:
  # spt_vit: repo's original ViT factory. hf: AutoModel.from_pretrained(...)
  # returning last_hidden_state, e.g. a local DINOv2/ViT directory.
  source: spt_vit
  pretrained: false
  model_name_or_path: null
  freeze: false
  local_files_only: true
  trust_remote_code: false

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 0.05

scheduler:
  # Null = train.py uses min(2000, 2% of max_steps). Set explicitly from
  # launcher scripts when comparing runs with a fixed warmup budget.
  warmup_steps: null

# CE label smoothing — overridden to 0 in the no-regularization ablation.
label_smoothing: 0.1

wm:
  type: vla_baseline
  embed_dim: 192

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.2
  emb_dropout: 0.0
  # null preserves the legacy behavior of mirroring projector.norm_type.
  # Set explicitly for projector ablations where the visual path is Identity.
  state_head_norm_type: null
  # shared: legacy dense predictor Transformer.
  # mot: Meta MoT-style modality routing. Language, visual, proprio, and
  # action tokens use separate non-embedding transformer parameters while
  # retaining global self-attention over the full sequence.
  state_prediction_arch: shared

# Visual projector; the paper full model overrides this in jewam.yaml.
# SIGReg requires batch normalization on the trainable CLS projector.
projector:
  type: mlp  # 'mlp' (legacy) | 'identity' (requires vision hidden_dim == wm.embed_dim)
  depth: 2  # Number of Linear layers; 2 preserves the legacy projector exactly.
  norm_type: layer  # 'layer' (baseline) | 'batch' (required when sigreg_weight > 0)

# Compatibility defaults. jewam.yaml enables the paper SP and SIGReg losses.
loss:
  pred_weight: 0.0       # > 0 enables Q_ag/Q_hd/Q_pr STATE_QUERY tokens + 3 MSE losses
  sigreg_weight: 0.0     # > 0 enables SIGReg on encoder outputs (Algorithm 1 strict)
  # Optional compatibility head; disabled in the paper experiments.
  gripper_aux_weight: 0.0
  sigreg:
    kwargs:
      knots: 17
      num_proj: 1024
